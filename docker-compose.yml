# =============================================================================
# GrafiExpress — stack completo con base de datos interna
#
#   nginx  (puerto público ${APP_PORT})  →  web (gunicorn :8000)  →  db (PostgreSQL)
#                                              └→ jasper (PDFs de facturas/remisiones) → db
#
# - La base de datos vive en el volumen "pgdata" y NO se publica al host
#   (solo es accesible desde la red interna "backend"). Ver DB_EXPOSE_PORT en
#   docker-compose.dev.yml si necesitás conectarte con pgAdmin/DBeaver.
# - Estáticos y archivos subidos los sirve nginx desde volúmenes compartidos.
# - Migraciones y collectstatic corren solos al arrancar "web".
#
# Uso: ver readme.md o "make help".
# =============================================================================

name: grafiexpress

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-grafiexpress}
      POSTGRES_USER: ${DB_USER:-grafiexpress}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: America/Asuncion
      PGTZ: America/Asuncion
      # Dump a restaurar la primera vez que se crea el volumen (opcional)
      DB_SEED_FILE: ${DB_SEED_FILE:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ./docker/db/seed:/seed:ro
      - ./docker/db/backups:/backups
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  web:
    build: .
    image: grafiexpress-web:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: grafiexpress.settings
      # La app siempre habla con el Postgres interno del stack
      DB_HOST: db
      DB_PORT: "5432"
      JASPER_URL: http://jasper:8080
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8002}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/static/admin/css/base.css || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # Servicio de reportes JasperReports (facturas y remisiones en PDF).
  # Java 8 + los mismos .jasper/.jar de common/jasper. Ver docker/jasper/.
  jasper:
    build:
      context: .
      dockerfile: docker/jasper/Dockerfile
    image: grafiexpress-jasper:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-grafiexpress}
      DB_USER: ${DB_USER:-grafiexpress}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: America/Asuncion
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

networks:
  backend:
    internal: true   # sin salida a internet: solo web <-> db
  frontend:

volumes:
  pgdata:
  static:
  media:
