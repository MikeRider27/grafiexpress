services:
  web:
    build: .
    ports:
      - "8002:8000"
    volumes:
      - .:/app
      - ./static_volume:/app/staticfiles
      - ./media:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=grafiexpress.settings
      - PYTHONPATH=/app
    restart: unless-stopped
    # Si necesitas comunicarte con un servicio corriendo en el host (fuera de Docker)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # --- Servicio de JasperReports (deshabilitado) --------------------------
    # depends_on:
    #   - jasper-report

  # ---------------------------------------------------------------------------
  # Servicio de JasperReports (socket en el puerto 5000) — DESHABILITADO
  #
  # No lo pudimos dejar funcionando tal cual estaba porque:
  #   1. Referencia "Dockerfile.jasper", que no existe en el repo.
  #   2. El comando apunta a "common/jasper/jasper_server.py", que tampoco
  #      existe. El script real es "common/jasper/server.py".
  #   3. Ese script no es Python normal: usa "import SocketServer" (Python 2)
  #      e imports Java (`from java.util import Properties`), o sea que
  #      necesita correr sobre Jython + un JDK, no sobre CPython 3.5 como el
  #      resto del proyecto. Requiere su propia imagen base.
  #   4. common/jasper/conector.py se conecta a 127.0.0.1:5000 hardcodeado.
  #      Entre contenedores separados eso no funciona: hay que parametrizarlo
  #      (ej. JASPER_HOST=jasper-report) para que apunte al hostname del
  #      servicio en la red de Docker.
  #
  # Para reactivarlo: crear Dockerfile.jasper con Jython + el JDK necesario,
  # corregir el nombre del script en "command", y parametrizar el host en
  # conector.py.
  # ---------------------------------------------------------------------------
  # jasper-report:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.jasper
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - .:/app
  #     - ./media:/app/media
  #   command: python /app/common/jasper/server.py
  #   restart: unless-stopped

