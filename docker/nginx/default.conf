upstream grafiexpress_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    # Los archivos subidos NO se sirven directo: pasan por la app, que exige
    # sesión y responde con X-Accel-Redirect a la location interna de abajo.
    location /media/ {
        proxy_pass http://grafiexpress_web;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Solo alcanzable vía X-Accel-Redirect desde la app (no directamente).
    location /_media_protegido/ {
        internal;
        alias /srv/media/;
        expires 1d;
    }

    location / {
        proxy_pass http://grafiexpress_web;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
